<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Uma Aula Muito Especial — para Ketlem 🦫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EC;
  --paper:#FFFDF7;
  --beige:#F1E3C8;
  --beige-dark:#E4D3AC;
  --brown-light:#C9A27B;
  --brown-capy:#9C6B44;
  --brown-dark:#6B4423;
  --ink:#5A4632;
  --green:#B7D6AC;
  --green-dark:#8FB984;
  --pink:#F3C6D0;
  --pink-dark:#E6A3B4;
  --gold:#E8B84B;
  --gold-dark:#C99A2E;
  --white:#FFFFFF;
  --shadow: 0 8px 24px rgba(107,68,35,0.18);
  --radius: 22px;
  --font-body:'Quicksand', 'Segoe UI', system-ui, sans-serif;
  --font-hand:'Caveat', 'Segoe Script', cursive;
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; min-height:100%;
  background: var(--cream);
  font-family: var(--font-body);
  color: var(--ink);
  overflow-x:hidden;
}
body{
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><text x='0' y='24' font-size='24'>🤍</text></svg>") 4 4, auto;
}
button, a, [role='button'], input, .clickable{ cursor: pointer; }
h1,h2,h3,p{ margin:0; }
button{
  font-family: var(--font-body);
  border:none;
  background:none;
}
img,svg{ display:block; max-width:100%; }
:focus-visible{
  outline: 3px solid var(--gold-dark);
  outline-offset: 3px;
  border-radius: 8px;
}
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ---------- APP SHELL ---------- */
#app{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 18px;
}
#stage-wrap{
  position:relative;
  width:100%;
  max-width:1180px;
  aspect-ratio: 16/9;
  min-height: clamp(520px, 74vh, 640px);
  background: var(--beige);
  border-radius: 28px;
  box-shadow: var(--shadow);
  overflow:hidden;
  border: 3px solid var(--white);
  outline: 6px solid var(--beige-dark);
  outline-offset: -6px;
}
#stage{
  position:absolute; inset:0;
  width:100%; height:100%;
  overflow:auto;
  transition: opacity .35s ease, transform .35s ease;
}
#stage.scene-fade-out{ opacity:0; transform: scale(.98); }
#stage.scene-fade-in{ animation: sceneIn .45s ease; }
@keyframes sceneIn{ from{opacity:0; transform: scale(1.01);} to{opacity:1; transform: scale(1);} }

.scene{
  position:relative;
  width:100%; min-height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: clamp(16px, 4vw, 48px);
  padding-top: max(96px, clamp(16px, 4vw, 48px));
  text-align:center;
  gap: 14px;
}

/* ---------- TEXTURE / PAPER LOOK ---------- */
.paper-texture{
  background-image:
    radial-gradient(rgba(107,68,35,0.035) 1px, transparent 1px);
  background-size: 14px 14px;
}

/* ---------- HUD ---------- */
#hud{
  position:absolute; top:14px; left:14px; z-index:20;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  max-width: min(60%, 260px);
  font-weight:600; font-size: clamp(12px,1.6vw,16px);
  color: var(--brown-dark);
  pointer-events:none;
}
#hud .hud-chip{
  background: rgba(255,253,247,0.85);
  padding: 6px 14px;
  border-radius: 999px;
  border: 2px solid var(--gold);
  box-shadow: 0 2px 8px rgba(107,68,35,0.12);
}

/* ---------- MENU CORNER ---------- */
#menu-corner{
  position:absolute; top:14px; right:14px; z-index:30;
  display:flex; gap:8px;
}
.menu-btn{
  width:38px; height:38px;
  border-radius:50%;
  background: rgba(255,253,247,0.9);
  border:2px solid var(--gold);
  font-size:17px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 8px rgba(107,68,35,0.15);
  transition: transform .2s ease;
}
.menu-btn:hover{ transform: scale(1.1) rotate(-4deg); }

/* ---------- BUTTONS ---------- */
.btn{
  font-family:var(--font-body);
  font-weight:700;
  font-size: clamp(14px,1.9vw,18px);
  color: var(--white);
  background: linear-gradient(180deg, var(--green-dark), #7CAA71);
  padding: 13px 30px;
  border-radius: 999px;
  box-shadow: 0 6px 0 #6c9863, 0 10px 18px rgba(107,68,35,0.2);
  transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  position:relative;
}
.btn:hover{ transform: translateY(-3px); filter:brightness(1.06); }
.btn:active{ transform: translateY(1px); box-shadow: 0 3px 0 #6c9863, 0 6px 10px rgba(107,68,35,0.2); }
.btn.secondary{
  background: linear-gradient(180deg, var(--pink-dark), #DB8EA2);
  box-shadow: 0 6px 0 #c07588, 0 10px 18px rgba(107,68,35,0.2);
}
.btn.secondary:active{ box-shadow: 0 3px 0 #c07588, 0 6px 10px rgba(107,68,35,0.2); }
.btn.ghost{
  background: transparent;
  color: var(--brown-dark);
  border: 2.5px solid var(--brown-light);
  box-shadow:none;
}
.btn.ghost:hover{ background: rgba(255,255,255,0.5); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.btn-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:6px; }

/* little heart burst on hover for main CTA */
.btn.cta{ position:relative; }
.heart-pop{
  position:absolute; pointer-events:none; font-size:16px;
  animation: heartPop 0.8s ease forwards;
}
@keyframes heartPop{
  0%{ opacity:1; transform: translateY(0) scale(0.6); }
  100%{ opacity:0; transform: translateY(-40px) scale(1.1); }
}

/* ---------- TITLES ---------- */
.title-hand{
  font-family: var(--font-hand);
  color: var(--brown-dark);
  font-size: clamp(30px, 5.4vw, 54px);
  line-height:1.05;
}
.subtitle{
  font-size: clamp(14px,2vw,18px);
  color: var(--brown-dark);
  opacity:.85;
}

/* ---------- CAPYBARA ---------- */
.capybara-wrap{
  position:relative;
  width: clamp(150px, 22vw, 230px);
  filter: drop-shadow(0 14px 10px rgba(107,68,35,0.22));
}
.capybara-img{
  width:100%;
  height:auto;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}
.capybara{
  animation: capyFloat 3.4s ease-in-out infinite;
  transform-origin: center bottom;
}
.capybara.clickable{ cursor:pointer; }
@keyframes capyFloat{
  0%,100%{ transform: translateY(0) rotate(-1.4deg); }
  50%{ transform: translateY(-9px) rotate(1.4deg); }
}
.capybara.celebrating{ animation: capyJump .55s ease-in-out infinite; }
@keyframes capyJump{
  0%,100%{ transform: translateY(0) scale(1) rotate(-2deg); }
  50%{ transform: translateY(-22px) scale(1.04) rotate(2deg); }
}
.capybara.sad{ animation: capySad 2.6s ease-in-out infinite; }
@keyframes capySad{
  0%,100%{ transform: translateY(0) rotate(-2deg); }
  50%{ transform: translateY(3px) rotate(2deg); }
}
.eye-blink{ animation: blink 5.2s infinite; transform-box: fill-box; transform-origin: center; }
.eye-blink.e2{ animation-delay: .05s; }
@keyframes blink{
  0%,90%,100%{ transform: scaleY(1); }
  95%{ transform: scaleY(0.12); }
}

/* ---------- DIALOGUE BOX ---------- */
.dialogue-box{
  width:min(720px, 92%);
  background: var(--paper);
  border:3px solid var(--brown-light);
  border-radius: 20px;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  text-align:left;
  position:relative;
}
.dialogue-name{
  display:inline-block;
  font-weight:700;
  color:var(--white);
  background: var(--brown-capy);
  padding: 4px 14px;
  border-radius: 999px;
  font-size: clamp(12px,1.6vw,14px);
  margin-bottom:8px;
}
.dialogue-text{
  font-size: clamp(15px,2.1vw,19px);
  min-height: 2.6em;
  line-height:1.4;
}
.dialogue-next{
  position:absolute; right:16px; bottom:12px;
  font-size:13px; font-weight:700; color: var(--brown-dark);
  visibility:hidden;
  animation: bounceHint 1.1s infinite;
}
@keyframes bounceHint{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }

/* ---------- FICHA / BOLETIM ---------- */
.card-paper{
  width:min(640px,94%);
  background: var(--paper);
  border-radius: 18px;
  border: 3px dashed var(--brown-light);
  padding: clamp(16px,3vw,32px);
  box-shadow: var(--shadow);
}
.field-row{
  display:flex; justify-content:space-between; gap:10px;
  padding: 7px 0;
  border-bottom: 1.5px dotted var(--beige-dark);
  font-size: clamp(13px,1.9vw,16px);
  opacity:0; transform: translateX(-10px);
  animation: fieldIn .45s ease forwards;
}
@keyframes fieldIn{ to{ opacity:1; transform:translateX(0);} }
.field-row b{ color: var(--brown-dark); }
.field-row span.value{ font-weight:700; }

/* ---------- QUIZ ---------- */
.quiz-question{
  font-size: clamp(16px,2.3vw,21px);
  font-weight:700;
  max-width:620px;
}
.quiz-options{
  display:grid; grid-template-columns: 1fr 1fr; gap:10px;
  width:min(620px,94%);
}
@media (max-width:560px){ .quiz-options{ grid-template-columns:1fr; } }
.quiz-opt{
  background: var(--paper);
  border:2.5px solid var(--brown-light);
  border-radius:14px;
  padding: 12px 14px;
  font-size: clamp(13px,1.8vw,16px);
  font-weight:600;
  text-align:left;
  transition: transform .12s ease, background .2s ease;
}
.quiz-opt:hover{ transform: translateY(-2px); background: var(--beige); }
.quiz-opt.correct{ background: var(--green); border-color: var(--green-dark); }
.quiz-opt.wrong{ background: var(--pink); border-color: var(--pink-dark); }
.quiz-feedback{ font-weight:700; min-height:1.4em; font-size: clamp(14px,2vw,17px); }
.heart-bar{ display:flex; gap:4px; font-size: clamp(16px,2.4vw,22px); }
.heart-bar span{ opacity:.25; transition: opacity .3s ease, transform .3s ease; }
.heart-bar span.on{ opacity:1; transform: scale(1.15); }

/* ---------- STAR HUNT ---------- */
.classroom-scene{
  position:relative; width:100%; height:100%; flex:1;
  border-radius:18px;
  background: linear-gradient(180deg, #EFE2C4 0%, #E6D4AC 60%, #DCC694 100%);
  overflow:hidden;
}
.deco{ position:absolute; }
.blackboard{
  position:absolute; top:clamp(10px,4%,22px); left:50%; transform:translateX(-50%);
  width: min(300px, 40%); height: clamp(56px,18%,92px);
  background:#3F5A44; border:9px solid #7a5233; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  color:#EFE7CF; font-family:var(--font-hand); font-size:clamp(13px,2.2vw,20px);
  text-align:center; padding:6px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}
.window-deco{
  position:absolute; top:8%; right:4%; width:14%; min-width:70px; aspect-ratio:1;
  background: linear-gradient(180deg,#BEE3EE,#8FC7DE);
  border:8px solid var(--white); border-radius:10px;
  box-shadow: inset 0 0 0 2px #cfe9f1;
}
.window-deco::before, .window-deco::after{
  content:''; position:absolute; background:var(--white);
}
.window-deco::before{ top:0; bottom:0; left:50%; width:6px; margin-left:-3px; }
.window-deco::after{ left:0; right:0; top:50%; height:6px; margin-top:-3px; }
.plant-deco{
  position:absolute; bottom:4%; right:8%; width:12%; min-width:56px;
}
.desk-deco{
  position:absolute; bottom:2%; left:6%; width:24%; min-width:110px;
}
.book-deco{
  position:absolute; bottom:13%; left:5%; width:7%; min-width:32px;
}
.star-spot{
  position:absolute; font-size: clamp(22px,3.4vw,34px);
  filter: drop-shadow(0 0 0px var(--gold));
  animation: starIdle 2.2s ease-in-out infinite;
  transition: filter .2s ease;
  z-index:6;
}
.star-spot:hover{ filter: drop-shadow(0 0 10px var(--gold)); transform:scale(1.1); }
@keyframes starIdle{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
.star-spot.found{ opacity:0; pointer-events:none; transform:scale(1.6); transition: all .4s ease; }
.stars-counter{
  position:absolute; top:10px; right:10px; left:auto; transform:none;
  background: rgba(255,253,247,0.92); padding:5px 14px; border-radius:999px;
  border:2px solid var(--gold); font-weight:700; z-index:5;
  font-size: clamp(12px,1.6vw,15px);
}
.star-msg-toast{
  position:absolute; left:50%; bottom:8%; transform:translateX(-50%);
  background: var(--paper); border:2px solid var(--gold);
  padding:10px 18px; border-radius:14px; font-weight:600;
  max-width:80%; text-align:center; box-shadow:var(--shadow);
  animation: toastIn .3s ease;
  z-index:6;
}
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
.secret-spot{ position:absolute; opacity:.001; }

/* ---------- PARTICLES ---------- */
.particle{
  position:absolute; pointer-events:none;
  font-size:14px;
  animation: particleFly 0.9s ease-out forwards;
}
@keyframes particleFly{
  0%{ opacity:1; transform: translate(0,0) scale(1) rotate(0deg); }
  100%{ opacity:0; transform: translate(var(--dx),var(--dy)) scale(0.4) rotate(180deg); }
}

/* ---------- PUZZLE ---------- */
.puzzle-grid{
  display:grid; grid-template-columns: repeat(3, 1fr);
  gap:5px;
  width:min(340px,70vw); aspect-ratio:1;
  background: var(--brown-light);
  padding:5px; border-radius:14px;
  box-shadow: var(--shadow);
}
.puzzle-tile{
  background-color: var(--beige);
  background-size:300% 300%;
  border-radius:8px;
  cursor:pointer;
  border:3px solid transparent;
  transition: transform .15s ease, border-color .2s ease;
}
.puzzle-tile:hover{ transform: scale(0.97); }
.puzzle-tile.selected{ border-color: var(--gold-dark); }
.puzzle-tile.solved{ border-color: var(--green-dark); animation: tilePulse .5s ease; }
@keyframes tilePulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }

/* ---------- CERTIFICATE ---------- */
.certificate{
  width:min(640px,94%);
  background: var(--paper);
  border: 4px solid var(--gold);
  outline: 2px solid var(--gold-dark);
  outline-offset: 6px;
  border-radius: 14px;
  padding: clamp(20px,4vw,40px);
  position:relative;
}
.certificate::before{
  content:'🦫'; position:absolute; top:-22px; left:50%; transform:translateX(-50%);
  font-size:34px; background:var(--cream); padding:0 10px;
}
.cert-name{
  font-family: var(--font-hand); font-size: clamp(34px,6vw,54px);
  color: var(--brown-dark); margin: 6px 0;
}
.cert-sign{
  font-family: var(--font-hand); font-size: clamp(26px,4vw,34px);
  color: var(--brown-dark); margin-top: 10px;
}
.cert-line{ font-size: clamp(13px,1.8vw,16px); }

/* ---------- LETTER SCENE ---------- */
.letter-scene-bg{
  position:absolute; inset:0;
  background: radial-gradient(circle at 50% 20%, #3a2f22 0%, #241c14 75%);
}
.night-particle{
  position:absolute; border-radius:50%;
  background: rgba(255,244,214,0.65);
  animation: floatUp linear infinite;
}
@keyframes floatUp{
  0%{ transform: translateY(0) translateX(0); opacity:0; }
  10%{opacity:1;}
  90%{opacity:.7;}
  100%{ transform: translateY(-140%) translateX(10px); opacity:0; }
}
.envelope{
  width: min(220px,50vw); position:relative; margin: 10px auto;
}
.envelope-body{
  width:100%; aspect-ratio: 3/2; background: var(--beige);
  border-radius:10px; position:relative; box-shadow: var(--shadow);
  border: 2px solid var(--brown-light);
}
.envelope-flap{
  position:absolute; top:0; left:0; width:100%; height:52%;
  background: var(--brown-light);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform .6s cubic-bezier(.34,1.56,.64,1);
  border-radius: 10px 10px 0 0;
}
.envelope.open .envelope-flap{ transform: rotateX(180deg); }
.letter-paper{
  width:min(560px,92%);
  background: var(--paper);
  border-radius: 6px;
  padding: clamp(18px,3.4vw,34px);
  box-shadow: 0 16px 34px rgba(0,0,0,0.35);
  transform: rotate(-0.6deg);
  text-align:left;
  max-height: 62vh; overflow-y:auto;
  font-family: var(--font-hand);
  font-size: clamp(17px,2.4vw,22px);
  line-height:1.55;
  color:#4A3826;
}
.letter-paper p{
  margin:0 0 10px 0;
  opacity:0; transform: translateY(8px);
  animation: paraIn .6s ease forwards;
}
@keyframes paraIn{ to{ opacity:1; transform:translateY(0);} }
.letter-sign{ text-align:right; font-weight:700; margin-top:6px; }
.letter-scene .title-hand, .letter-scene .subtitle{ color:#F3E9D2; }

/* ---------- FINAL SCENE ---------- */
.stars-bg{ position:absolute; inset:0; overflow:hidden; }
.twinkle{
  position:absolute; background:#fff; border-radius:50%;
  animation: twinkle 2.6s ease-in-out infinite;
}
@keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:1;} }

/* ---------- CONFETTI ---------- */
.confetti-piece{
  position:fixed; top:-20px; width:9px; height:14px; z-index:200;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall{
  to{ transform: translateY(110vh) rotate(540deg); opacity:.9; }
}

/* ---------- MODAL (help) ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(90,70,50,0.45);
  display:flex; align-items:center; justify-content:center; z-index:100;
  padding:20px;
}
.modal-box{
  background: var(--paper); border-radius:18px; padding:26px;
  max-width:420px; text-align:left; box-shadow: var(--shadow);
  border: 3px solid var(--gold);
}
.modal-box h3{ font-family:var(--font-hand); font-size:26px; color:var(--brown-dark); margin-bottom:10px; }
.modal-box p{ font-size:14px; margin-bottom:8px; line-height:1.5; }

.toast-global{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
  background: var(--brown-dark); color:var(--white);
  padding:10px 20px; border-radius:999px; font-weight:600; font-size:14px;
  z-index:300; box-shadow: var(--shadow);
  animation: toastPop .3s ease;
}
@keyframes toastPop{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

@media (max-width:640px){
  #stage-wrap{ border-radius:18px; }
  .btn{ padding:12px 22px; }
  .quiz-options{ width:96%; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <div id="hud" aria-hidden="false"></div>
    <div id="menu-corner">
      <button class="menu-btn" id="btn-sound" aria-label="Ativar ou desativar som">🔊</button>
      <button class="menu-btn" id="btn-restart" aria-label="Reiniciar jogo">↻</button>
      <button class="menu-btn" id="btn-help" aria-label="Ajuda">?</button>
    </div>
    <main id="stage" class="paper-texture" aria-live="polite"></main>
  </div>
</div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   UMA AULA MUITO ESPECIAL — presente de mêsversário
   Jogo 2D para navegador. Sem backend, sem dependências externas.
   ========================================================= */

/* ---------------- ESTADO ---------------- */
const STORAGE_KEY = 'ketlem-mesversario-save-v1';

function defaultState(){
  return {
    scene: 'inicio',
    quizIndex: 0,
    quizScore: 0,
    starsFound: [],
    puzzleSolved: false,
    puzzleOrder: null,
    soundOn: true,
    capybaraClicks: 0,
    secretBook: false,
    secretPencil: false,
    letterOpened: false,
    cameFromFinal: false
  };
}
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return Object.assign(defaultState(), parsed);
    }
  }catch(e){ /* ignora erro de storage */ }
  return defaultState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* segue sem salvar */ }
}
function resetState(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = defaultState();
}

/* ---------------- ÁUDIO (gerado, sem arquivos externos) ---------------- */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function playTone(freq, duration, type, delay){
  if(!state.soundOn) return;
  const ctx = getCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.09, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
const sfx = {
  click: ()=> playTone(520, 0.09, 'sine'),
  correct: ()=>{ playTone(523.25,0.14,'sine'); playTone(659.25,0.18,'sine',0.09); playTone(783.99,0.22,'sine',0.18); },
  wrong: ()=>{ playTone(220,0.18,'sine'); playTone(196,0.22,'sine',0.1); },
  star: ()=>{ playTone(880,0.12,'sine'); playTone(1174.6,0.16,'sine',0.08); },
  complete: ()=>{ playTone(523.25,0.14,'triangle'); playTone(659.25,0.14,'triangle',0.1); playTone(783.99,0.14,'triangle',0.2); playTone(1046.5,0.2,'triangle',0.3); },
  open: ()=>{ playTone(300,0.3,'sine'); playTone(500,0.3,'sine',0.12); }

/* ---------------- TOAST ---------------- */
function showToast(text, duration){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast-global';
  el.textContent = text;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(), 420); }, duration || 2300);
}

/* ---------------- CONFETES ---------------- */
function launchConfetti(count){
  const colors = ['#E8B84B','#B7D6AC','#F3C6D0','#C9A27B','#FBF6EC'];
  for(let i=0;i<(count||28);i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const x = Math.random()*100;
    p.style.left = x+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.borderRadius = Math.random()>0.5 ? '50%':'2px';
    const dur = 1.6 + Math.random()*1.4;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = (Math.random()*0.4)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), (dur+0.5)*1000);
  }
}

/* ---------------- PARTÍCULAS (estrelas/corações) ---------------- */
function burstParticles(x, y, glyph, count){
  const stageWrap = document.getElementById('stage-wrap');
  const rect = stageWrap.getBoundingClientRect();
  for(let i=0;i<(count||8);i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = glyph || '✨';
    const angle = Math.random()*Math.PI*2;
    const dist = 30 + Math.random()*40;
    p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    p.style.left = (x - rect.left) + 'px';
    p.style.top = (y - rect.top) + 'px';
    stageWrap.appendChild(p);
    setTimeout(()=>p.remove(), 950);
  }
}

/* ---------------- TYPEWRITER / DIÁLOGO ---------------- */
function typeWriter(el, text, speed, cb){
  el.textContent = '';
  let idx = 0;
  if(el._typerInterval) clearInterval(el._typerInterval);
  el._typerDone = false;
  el._typerFull = text;
  el._typerInterval = setInterval(()=>{
    idx++;
    el.textContent = text.slice(0, idx);
    if(idx >= text.length){
      clearInterval(el._typerInterval);
      el._typerDone = true;
      cb && cb();
    }
  }, speed || 26);
}
function skipTyping(el){
  if(el._typerInterval){ clearInterval(el._typerInterval); }
  if(el._typerFull){ el.textContent = el._typerFull; }
  el._typerDone = true;
}

/**
 * Toca uma sequência de falas em uma dialogue-box já presente no DOM.
 * lines: [{name?, text}]
 * onComplete: chamado ao final de todas as falas
 */
function playDialogue(container, lines, onComplete){
  const nameEl = container.querySelector('.dialogue-name');
  const textEl = container.querySelector('.dialogue-text');
  const nextEl = container.querySelector('.dialogue-next');
  let i = 0;
  function showLine(){
    if(i >= lines.length){ nextEl.style.visibility='hidden'; onComplete && onComplete(); return; }
    const line = lines[i];
    nameEl.textContent = line.name || 'Professora Capivara';
    nextEl.style.visibility = 'hidden';
    typeWriter(textEl, line.text, 24, ()=>{ nextEl.style.visibility='visible'; });
    i++;
  }
  function advance(){
    sfx.click();
    if(!textEl._typerDone){ skipTyping(textEl); nextEl.style.visibility='visible'; return; }
    showLine();
  }
  if(container._advanceHandler){ container.removeEventListener('click', container._advanceHandler); }
  container._advanceHandler = advance;
  container.addEventListener('click', advance);
  showLine();
}

/* ---------------- PROFESSORA CAPIVARA (SVG) ---------------- */
function capybaraSVG(extraClass, sizeStyle, variant){
  const src = (variant === 'coracao') ? IMG_CAPY_CORACAO : IMG_CAPY_LENDO;
  const label = (variant === 'coracao')
    ? 'Professora Capivara segurando um coração'
    : 'Professora Capivara lendo um livro';
  return `
  <div class="capybara-wrap" ${sizeStyle ? `style="${sizeStyle}"` : ''}>
    <div class="capybara ${extraClass||''}" id="capybara-el">
      <img src="${src}" alt="${label}" class="capybara-img" draggable="false">
    </div>
  </div>`;
}

/* ---------------- NAVEGAÇÃO ENTRE CENAS ---------------- */
const MISSION_OF_SCENE = { prova:1, estrelinhas:2, quebracabeca:3 };
function updateHud(){
  const hud = document.getElementById('hud');
  if(state.scene === 'inicio'){ hud.innerHTML=''; return; }
  const mission = MISSION_OF_SCENE[state.scene];
  hud.innerHTML = `
    <span class="hud-chip">Ketlem 🤍</span>
    ${mission ? `<span class="hud-chip">Missão ${mission}/3</span>` : ''}
    ${state.scene==='estrelinhas' ? `<span class="hud-chip">⭐ ${state.starsFound.length}/5</span>` : ''}
  `;
}
function goToScene(name){
  sfx.click();
  const stage = document.getElementById('stage');
  stage.classList.add('scene-fade-out');
  setTimeout(()=>{
    state.scene = name;
    saveState();
    stage.innerHTML = '';
    stage.scrollTop = 0;
    stage.classList.remove('scene-fade-out');
    (sceneRenderers[name] || sceneRenderers.inicio)(stage);
    updateHud();
    stage.classList.add('scene-fade-in');
    setTimeout(()=> stage.classList.remove('scene-fade-in'), 480);
  }, 320);
}

/* Clique secreto na capivara (funciona em qualquer cena onde ela apareça) */
const CAPY_SECRET_LINES = [
  'Ei!',
  'Eu sou a professora, não um botão.',
  'Você realmente gosta dessa capivara, né?',
  'Eu também gosto de você, Ketlem.'
];
function wireCapybaraSecret(root){
  const capy = root.querySelector('#capybara-el');
  if(!capy) return;
  capy.classList.add('clickable');
  capy.setAttribute('tabindex','0');
  capy.setAttribute('role','button');
  capy.setAttribute('aria-label','Professora Capivara');
  const trigger = (ev)=>{
    ev.stopPropagation();
    const idx = Math.min(state.capybaraClicks, CAPY_SECRET_LINES.length-1);
    showToast(CAPY_SECRET_LINES[idx]);
    sfx.click();
    state.capybaraClicks++;
    saveState();
  };
  capy.addEventListener('click', trigger);
  capy.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); trigger(ev); } });
}

/* ================= CENA 1 — INÍCIO ================= */
function renderInicio(stage){
  stage.innerHTML = `
  <div class="scene classroom-scene" style="justify-content:flex-start; padding-top:132px; gap:8px;">
    ${classroomDecor('UMA AULA MUITO ESPECIAL')}
    <svg aria-hidden="true" style="position:absolute; bottom:20%; left:15%; width:7%; min-width:36px; transform:rotate(-18deg); z-index:2;" viewBox="0 0 100 20" class="clickable" id="deco-pencil">
      <rect x="0" y="6" width="80" height="8" fill="#E8B84B"/>
      <polygon points="80,4 96,10 80,16" fill="#C9A27B"/>
      <rect x="0" y="6" width="10" height="8" fill="#F3C6D0"/>
    </svg>
    <div style="position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div>${capybaraSVG('', 'width:clamp(100px,15vw,170px);')}</div>
      <p class="subtitle" style="font-weight:700; margin-top:4px;">Preparada especialmente para Ketlem 🤍</p>
      <h1 class="title-hand" style="font-size:clamp(28px,4.6vw,46px);">Olá, Ketlem!</h1>
      <p class="subtitle" style="max-width:480px;">Você foi convocada para participar de uma atividade extremamente importante.</p>
      <button class="btn cta" id="btn-start" style="margin-top:6px;">COMEÇAR A AULA 🦫</button>
    </div>
  </div>`;
  wireCapybaraSecret(stage);

  const startBtn = stage.querySelector('#btn-start');
  startBtn.addEventListener('mouseenter', (ev)=>{
    const wrap = document.getElementById('stage-wrap');
    const r = wrap.getBoundingClientRect();
    for(let i=0;i<3;i++){
      const h = document.createElement('div');
      h.className='heart-pop';
      h.textContent = ['🤍','✨','💛'][i%3];
      h.style.left = (ev.clientX - r.left + (Math.random()*30-15)) + 'px';
      h.style.top = (ev.clientY - r.top) + 'px';
      wrap.appendChild(h);
      setTimeout(()=>h.remove(), 850);
    }
  });
  startBtn.addEventListener('click', ()=> goToScene('intro'));

  const book = stage.querySelector('.book-deco');
  if(book && !state.secretBook){
    book.classList.add('clickable');
    book.addEventListener('click', ()=>{
      state.secretBook = true; saveState();
      showToast('Você encontrou um carinho secreto. 🤍');
    });
  }
  const pencil = stage.querySelector('#deco-pencil');
  if(pencil && !state.secretPencil){
    pencil.addEventListener('click', ()=>{
      state.secretPencil = true; saveState();
      showToast('Material escolar aprovado.');
    });
  }
}

function renderQuizQuestion(stage){
  const idx = state.quizIndex;
  if(idx >= QUIZ.length){ return finishQuiz(stage); }
  const item = QUIZ[idx];
  stage.querySelector('#quiz-q').textContent = `Pergunta ${idx+1}: ${item.q}`;
  const optsWrap = stage.querySelector('#quiz-opts');
  optsWrap.innerHTML = item.options.map((opt,i)=>`<button class="quiz-opt" data-i="${i}">${opt}</button>`).join('');
  stage.querySelector('#quiz-feedback').textContent = '';
  optsWrap.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click', ()=> handleQuizAnswer(stage, item, Number(btn.dataset.i)));
  });
}

function handleQuizAnswer(stage, item, chosen){
  const optsWrap = stage.querySelector('#quiz-opts');
  const fb = stage.querySelector('#quiz-feedback');
  optsWrap.querySelectorAll('.quiz-opt').forEach(b=> b.disabled = true);
  const chosenBtn = optsWrap.querySelector(`[data-i="${chosen}"]`);
  if(chosen === item.correct){
    sfx.correct();
    chosenBtn.classList.add('correct');
    fb.textContent = item.rightMsg.join('  ');
    const hearts = stage.querySelectorAll('#heart-bar span');
    if(hearts[state.quizIndex]) hearts[state.quizIndex].classList.add('on');
    state.quizScore += 100;
    setTimeout(()=>{
      if(state.scene !== 'prova') return;
      state.quizIndex++; saveState(); renderQuizQuestion(stage);
    }, 1300);
  } else {
    sfx.wrong();
    chosenBtn.classList.add('wrong');
    fb.textContent = item.wrongMsg.join('  ');
    setTimeout(()=>{
      optsWrap.querySelectorAll('.quiz-opt').forEach(b=>{ b.disabled=false; b.classList.remove('wrong'); });
      fb.textContent='';
    }, 1200);
  }
}

/* ================= CENA 6 — QUEBRA-CABEÇA ================= */
function shuffledOrder(){
  let arr = [0,1,2,3,4,5,6,7,8];
  do{
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
  }while(arr.every((v,i)=>v===i));
  return arr;
}
function renderQuebraCabeca(stage){
  if(!state.puzzleOrder){
    state.puzzleOrder = shuffledOrder();
    saveState();
  }
  stage.innerHTML = `
  <div class="scene">
    <h2 class="title-hand" style="font-size:clamp(22px,3.6vw,30px);">ÚLTIMA ATIVIDADE</h2>
    <p class="subtitle">Agora vamos descobrir uma coisa muito importante.</p>
    <div class="puzzle-grid" id="puzzle-grid" role="group" aria-label="Quebra-cabeça de 9 peças"></div>
    <p class="quiz-feedback" id="puzzle-msg"></p>
    <button class="btn cta" id="btn-puzzle-next" style="display:none;">PRÓXIMA ETAPA</button>
  </div>`;
  const grid = stage.querySelector('#puzzle-grid');
  const img = puzzleImageDataURI();
  let selected = null;

  function draw(){
    grid.innerHTML = '';
    state.puzzleOrder.forEach((contentIdx, pos)=>{
      const row = Math.floor(contentIdx/3), col = contentIdx%3;
      const tile = document.createElement('button');
      tile.className = 'puzzle-tile' + (state.puzzleSolved ? ' solved' : '');
      tile.style.backgroundImage = `url("${img}")`;
      tile.style.backgroundPosition = `${col*50}% ${row*50}%`;
      tile.dataset.pos = pos;
      tile.setAttribute('aria-label', `peça do quebra-cabeça posição ${pos+1}`);
      if(!state.puzzleSolved){
        tile.addEventListener('click', ()=> onTileClick(pos));
      }
      grid.appendChild(tile);
    });
  }
  function onTileClick(pos){
    sfx.click();
    if(selected === null){
      selected = pos;
      grid.children[pos].classList.add('selected');
      return;
    }
    if(selected === pos){
      grid.children[pos].classList.remove('selected');
      selected = null;
      return;
    }
    const tmp = state.puzzleOrder[selected];
    state.puzzleOrder[selected] = state.puzzleOrder[pos];
    state.puzzleOrder[pos] = tmp;
    grid.children[selected].classList.remove('selected');
    selected = null;
    saveState();
    draw();
    checkSolved();
  }
  function checkSolved(){
    if(state.puzzleOrder.every((v,i)=> v===i)){
      state.puzzleSolved = true;
      saveState();
      sfx.complete();
      launchConfetti(24);
      draw();
      stage.querySelector('#puzzle-msg').textContent = 'VOCÊ CONSEGUIU! 🤍';
      stage.querySelector('#btn-puzzle-next').style.display = 'inline-block';
    }
  }
  draw();
  if(state.puzzleSolved){
    stage.querySelector('#puzzle-msg').textContent = 'VOCÊ CONSEGUIU! 🤍';
    stage.querySelector('#btn-puzzle-next').style.display = 'inline-block';
  }
  stage.querySelector('#btn-puzzle-next').addEventListener('click', ()=> goToScene('resultado'));
}

  });
}

/* ================= REGISTRO DE CENAS ================= */
const sceneRenderers = {
  inicio: renderInicio,
  intro: renderIntro,
  ficha: renderFicha,
  prova: renderProva,
  estrelinhas: renderEstrelinhas,
  quebracabeca: renderQuebraCabeca,
  resultado: renderResultado,
  certificado: renderCertificado,
  carta: (stage)=> renderCarta(stage, false),
  final: renderFinal
};

/* ================= MENU (som / reiniciar / ajuda) ================= */
function updateSoundBtn(){
  document.getElementById('btn-sound').textContent = state.soundOn ? '🔊' : '🔇';
}
document.getElementById('btn-sound').addEventListener('click', ()=>{
  state.soundOn = !state.soundOn;
  saveState();
  updateSoundBtn();
  if(state.soundOn) sfx.click();
});
document.getElementById('btn-restart').addEventListener('click', ()=>{
  const ok = window.confirm('Reiniciar a aula do começo? Seu progresso atual será apagado.');
  if(ok){
    resetState();
    goToScene('inicio');
  }
});
document.getElementById('btn-help').addEventListener('click', ()=>{
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="help-overlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h3 id="help-title">Como jogar 🦫</h3>
      <p>Clique nos botões e elementos destacados para avançar pela aula da Professora Capivara.</p>
      <p>Toque na caixa de diálogo para acelerar as falas.</p>
      <p>Use os ícones no canto: 🔊 liga/desliga o som, ↻ reinicia a aula, ? abre esta ajuda.</p>
      <p>Divirta-se, Ketlem! 🤍</p>
      <button class="btn ghost" id="help-close">Fechar</button>
    </div>
  </div>`;
  const close = ()=> { root.innerHTML=''; };
  document.getElementById('help-close').addEventListener('click', close);
  document.getElementById('help-overlay').addEventListener('click', (e)=>{ if(e.target.id==='help-overlay') close(); });
});

/* ================= INICIALIZAÇÃO ================= */
updateSoundBtn();
goToSceneOnBoot();
function goToSceneOnBoot(){
  const stage = document.getElementById('stage');
  const startScene = sceneRenderers[state.scene] ? state.scene : 'inicio';
  (sceneRenderers[startScene])(stage);
  updateHud();
  stage.classList.add('scene-fade-in');
  setTimeout(()=> stage.classList.remove('scene-fade-in'), 480);
}
</script>
</body>
